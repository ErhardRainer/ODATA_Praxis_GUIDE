<article class="animate-in fade-in slide-in-from-bottom-2 duration-500 space-y-6">
  <h2 class="text-3xl font-extrabold tracking-tight">SAP <span class="text-slate-300 mx-2">&rsaquo;</span> クエリビルダー</h2>
  <p class="text-lg text-slate-700 leading-relaxed">
    フィルタの追加、フィールドの選択、ページングオプションの設定を行い、有効な OData URL を対話的に構築します。
  </p>

  <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-6">
    
    <div>
      <label class="block text-sm font-bold text-slate-700 mb-1">ベース URL (サービスルート)</label>
      <input type="text" id="baseUrl" value="https://my-s4hana.com/sap/opu/odata/sap/API_SALES_ORDER_SRV" class="w-full p-2 border border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 font-mono text-sm" placeholder="https://host/service">
      <p class="text-xs text-slate-400 mt-1">OData サービスのルート URL です。</p>
    </div>

    <div>
      <label class="block text-sm font-bold text-slate-700 mb-1">エンティティセット</label>
      <input type="text" id="entitySet" value="A_SalesOrder" class="w-full p-2 border border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 font-mono text-sm" placeholder="例: A_SalesOrder">
    </div>

    <div class="bg-slate-50 p-4 rounded-lg border border-slate-100">
      <div class="flex justify-between items-center mb-3">
        <label class="block text-sm font-bold text-slate-700">$filter</label>
        <button id="addFilterBtn" class="px-3 py-1.5 bg-white border border-blue-200 text-blue-600 rounded-md text-xs font-bold uppercase tracking-wide hover:bg-blue-50 transition-colors shadow-sm">+ フィルタを追加</button>
      </div>
      <div id="filterContainer" class="space-y-2 empty:hidden"></div>
      <p class="text-xs text-slate-400 mt-2 italic">「フィルタを追加」をクリックして条件を定義します。</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1">$select <span class="text-slate-400 font-normal">(カンマ区切り)</span></label>
        <input type="text" id="select" placeholder="SalesOrder, NetValue" class="w-full p-2 border border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 font-mono text-sm">
      </div>
      <div>
         <label class="block text-sm font-bold text-slate-700 mb-1">$orderby</label>
         <input type="text" id="orderby" placeholder="CreationDate desc" class="w-full p-2 border border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 font-mono text-sm">
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1">$top</label>
        <input type="number" id="top" placeholder="例: 50" class="w-full p-2 border border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 font-mono text-sm">
      </div>
      <div>
         <label class="block text-sm font-bold text-slate-700 mb-1">$skip</label>
         <input type="number" id="skip" placeholder="例: 0" class="w-full p-2 border border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 font-mono text-sm">
      </div>
    </div>

    <div>
      <label class="block text-sm font-bold text-slate-700 mb-2">出力形式 ($format)</label>
      <div class="flex gap-4">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="radio" name="format" value="json" checked class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500">
          <span class="text-sm text-slate-600">JSON</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="radio" name="format" value="xml" class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500">
          <span class="text-sm text-slate-600">XML / Atom</span>
        </label>
      </div>
    </div>
    
    <div class="bg-blue-50 p-5 rounded-lg border border-blue-100 mt-8">
        <label class="block text-xs uppercase tracking-wide font-bold text-blue-800 mb-2">生成された URL</label>
        <div class="flex items-center gap-2">
            <div id="generatedUrl" class="block w-full text-sm font-mono text-slate-800 break-all bg-white p-3 rounded border border-blue-200 min-h-[46px] flex items-center shadow-sm"></div>
            <button id="copyBtn" class="flex-none p-3 bg-white border border-blue-200 rounded hover:bg-blue-50 text-blue-600 shadow-sm transition-colors" title="クリップボードにコピー">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
        </div>
    </div>

  </div>
</article>
