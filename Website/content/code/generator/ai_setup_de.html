<article class="animate-in fade-in slide-in-from-right-4 duration-500">
  <div class="flex items-center gap-3 mb-6">
    <h2 class="text-3xl font-extrabold tracking-tight text-purple-600">KI Code Generator</h2>
    <span class="text-purple-400" aria-hidden="true">*</span>
  </div>

  <div class="space-y-6" data-copy-scope>
    <div class="space-y-2">
      <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
        OData Service URL
      </label>
      <input data-ai-url type="text" placeholder="https://services.odata.org/V4/Northwind/Northwind.svc/Products" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-purple-500 outline-none transition-all" />
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="space-y-2">
        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">Zielsprache</label>
        <select data-ai-lang class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-purple-500 outline-none transition-all cursor-pointer appearance-none">
          <option value="python">Python</option>
          <option value="js">JavaScript</option>
          <option value="csharp">C#</option>
          <option value="vbnet">VB.NET</option>
          <option value="java">Java</option>
        </select>
      </div>

      <div class="space-y-2">
        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">Authentifizierung</label>
        <select data-ai-auth class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-purple-500 outline-none transition-all cursor-pointer appearance-none">
          <option value="none">Keine / &Ouml;ffentlich</option>
          <option value="basic">Basic Auth (User/Pass)</option>
          <option value="oauth2">OAuth 2.0 / Bearer</option>
          <option value="apikey">API-Key (Header)</option>
          <option value="sap">SAP Principal Propagation</option>
        </select>
      </div>

      <div class="space-y-2">
        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">OData Version</label>
        <select data-ai-version class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-purple-500 outline-none transition-all cursor-pointer appearance-none">
          <option value="v2">OData V2 (Legacy / SAP)</option>
          <option value="v4" selected>OData V4 (Modern)</option>
          <option value="auto">Automatisch erkennen</option>
        </select>
      </div>
    </div>

    <div class="space-y-2">
      <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Spezielle Anforderungen</label>
      <textarea data-ai-prompt placeholder="z.B. Verwende die 'requests' library, implementiere Fehler-Handling f&uuml;r 404, Filter auf 'Discontinued eq true'..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-purple-500 outline-none transition-all h-20 resize-none"></textarea>
    </div>

    <button data-ai-generate class="w-full bg-purple-600 hover:bg-purple-700 disabled:bg-slate-300 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-3 transition-all shadow-lg active:scale-95" disabled>
      Optimierten Code generieren
    </button>

    <div class="mt-8">
      <div class="bg-slate-900 rounded-2xl p-6 border border-slate-800 shadow-xl overflow-hidden">
        <div class="flex justify-between items-center mb-4">
          <span class="text-xs font-mono text-purple-400 flex items-center gap-2">KI-Vorschlag</span>
          <button data-ai-copy class="text-slate-500 hover:text-white transition-colors p-1 bg-slate-800 rounded" data-copy-target="pre code" title="Copy">Copy</button>
        </div>
        <pre class="text-sm font-mono text-slate-300 leading-relaxed overflow-x-auto p-2"><code data-ai-output></code></pre>
      </div>
      <p class="mt-3 text-xs text-slate-500">Hinweis: API-Key ist aktuell leer (Platzhalter), wie in der urspr&uuml;nglichen Version.</p>
    </div>
  </div>
</article>
